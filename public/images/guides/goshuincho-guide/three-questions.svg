<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="Three things to think about before choosing a goshuin book: where to get it, how many to collect, how to carry it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8f1"/><stop offset="1" stop-color="#f7ecdd"/></linearGradient>
    <g id="num"><circle r="16" fill="#e8887a"/></g>
    <g id="book"><rect x="-26" y="-38" width="52" height="76" rx="5" fill="#31507a"/><rect x="-26" y="-38" width="52" height="76" rx="5" fill="none" stroke="#ddb877" stroke-width="2.5"/><rect x="-5" y="-38" width="10" height="76" fill="#e8887a"/></g>
  </defs>
  <rect width="960" height="250" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="956" height="246" rx="20" fill="none" stroke="#ddb877" stroke-opacity=".5" stroke-width="2"/>

  <!-- dividers -->
  <g stroke="#ddb877" stroke-opacity=".6" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"><path d="M320 40 v170"/><path d="M640 40 v170"/></g>

  <!-- 1: where to get it : shrine office with a counter -->
  <g transform="translate(160 150)">
    <path d="M-84 -34 L0 -84 L84 -34 Z" fill="#e8887a"/>
    <rect x="-72" y="-34" width="144" height="82" fill="#fffdf9" stroke="#ddb877" stroke-width="3"/>
    <rect x="-52" y="-12" width="104" height="14" fill="#c9a36a"/>
    <rect x="-52" y="2" width="104" height="46" fill="#f3e7d6" stroke="#ddb877" stroke-width="2"/>
    <g transform="translate(-26 -22) scale(.6)"><use href="#book"/></g>
    <g transform="translate(0 -22) scale(.6)"><use href="#book"/></g>
    <g transform="translate(26 -22) scale(.6)"><use href="#book"/></g>
    <g transform="translate(0 -104)"><circle r="0" fill="none"/></g>
  </g>
  <g transform="translate(60 44)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">1</text></g>

  <!-- 2: how many to collect : books of different thickness -->
  <g transform="translate(480 150)">
    <g transform="translate(-60 0)"><rect x="-24" y="-40" width="48" height="88" rx="5" fill="#7fb0c9"/><rect x="-24" y="-40" width="48" height="88" rx="5" fill="none" stroke="#ddb877" stroke-width="2.5"/></g>
    <g transform="translate(10 0)"><rect x="-26" y="-54" width="52" height="102" rx="5" fill="#31507a"/><rect x="-26" y="-54" width="52" height="102" rx="5" fill="none" stroke="#ddb877" stroke-width="2.5"/></g>
    <g transform="translate(82 0)"><rect x="-26" y="-70" width="52" height="118" rx="5" fill="#e8887a"/><rect x="-26" y="-70" width="52" height="118" rx="5" fill="none" stroke="#ddb877" stroke-width="2.5"/></g>
    <path d="M-100 48 h210" stroke="#c9a36a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(380 44)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">2</text></g>

  <!-- 3: how to carry it : drawstring bag with a book -->
  <g transform="translate(800 150)">
    <g transform="translate(0 -22) rotate(-8)"><use href="#book"/></g>
    <path d="M-52 -8 Q-60 52 -46 56 L46 56 Q60 52 52 -8 Q0 6 -52 -8 Z" fill="#7fb0c9" stroke="#5c4f45" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-52 -8 Q0 6 52 -8" fill="none" stroke="#5c4f45" stroke-width="3"/>
    <path d="M-20 -2 q-18 -30 -34 -22 M20 -2 q18 -30 34 -22" fill="none" stroke="#c9a36a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="10" fill="#fdf8f1" stroke="#d94b3a" stroke-width="3"/>
  </g>
  <g transform="translate(700 44)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">3</text></g>
</svg>
