<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="Three ways to carry a goshuin book: a drawstring bag, a case, and a canvas bag">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf8f1"/><stop offset="1" stop-color="#f7ecdd"/></linearGradient>
    <g id="book"><rect x="-26" y="-38" width="52" height="76" rx="5" fill="#31507a"/><rect x="-26" y="-38" width="52" height="76" rx="5" fill="none" stroke="#ddb877" stroke-width="2.5"/><rect x="-5" y="-38" width="10" height="76" fill="#e8887a"/></g>
  </defs>
  <rect width="960" height="250" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="956" height="246" rx="20" fill="none" stroke="#ddb877" stroke-opacity=".5" stroke-width="2"/>
  <g stroke="#ddb877" stroke-opacity=".6" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"><path d="M320 40 v170"/><path d="M640 40 v170"/></g>

  <!-- drawstring bag -->
  <g transform="translate(160 138)">
    <g transform="translate(0 -26) rotate(-7)"><use href="#book"/></g>
    <path d="M-60 -10 Q-70 64 -52 68 L52 68 Q70 64 60 -10 Q0 8 -60 -10 Z" fill="#31507a" stroke="#5c4f45" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-60 -10 Q0 8 60 -10" fill="none" stroke="#5c4f45" stroke-width="3"/>
    <path d="M-22 -2 q-20 -34 -38 -24 M22 -2 q20 -34 38 -24" fill="none" stroke="#e8887a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="30" r="12" fill="#fdf8f1"/><circle cx="0" cy="30" r="5" fill="#d94b3a"/>
  </g>

  <!-- zip case -->
  <g transform="translate(480 138)">
    <rect x="-58" y="-66" width="116" height="132" rx="14" fill="#e8887a" stroke="#5c4f45" stroke-width="3"/>
    <rect x="-58" y="-66" width="116" height="132" rx="14" fill="none" stroke="#fdf8f1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" transform="scale(.86)"/>
    <path d="M-48 -34 H48" stroke="#fdf8f1" stroke-width="5" stroke-dasharray="3 6" stroke-linecap="round"/>
    <rect x="30" y="-42" width="18" height="16" rx="4" fill="#ddb877"/>
    <g transform="translate(0 14) scale(.7)"><use href="#book"/></g>
  </g>

  <!-- canvas bag with strap -->
  <g transform="translate(800 142)">
    <path d="M-34 -36 Q-34 -104 0 -104 Q34 -104 34 -36" fill="none" stroke="#c9a36a" stroke-width="9" stroke-linecap="round"/>
    <rect x="-76" y="-38" width="152" height="104" rx="10" fill="#7fb0c9" stroke="#5c4f45" stroke-width="3"/>
    <rect x="-76" y="-38" width="152" height="26" rx="10" fill="#6aa0bb"/>
    <rect x="-40" y="-2" width="80" height="48" rx="6" fill="#fdf8f1" stroke="#ddb877" stroke-width="3"/>
    <g transform="translate(0 22) scale(.5)"><use href="#book"/></g>
  </g>
</svg>
