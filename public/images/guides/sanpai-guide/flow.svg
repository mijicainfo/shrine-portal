<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="Shrine visit flow: 1 torii, 2 approach, 3 temizuya, 4 haiden, 5 pray, 6 leave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8f1"/>
      <stop offset="1" stop-color="#f7ecdd"/>
    </linearGradient>
    <g id="num"><circle r="16" fill="#e8887a"/></g>
    <g id="person">
      <circle cx="0" cy="-30" r="10" fill="#5c4f45"/>
      <path d="M-13 -17 Q0 -21 13 -17 L15 14 L-15 14 Z" fill="#7fb0c9"/>
      <rect x="-10" y="14" width="8" height="20" rx="3" fill="#5c4f45"/>
      <rect x="2" y="14" width="8" height="20" rx="3" fill="#5c4f45"/>
    </g>
  </defs>
  <rect width="960" height="250" rx="22" fill="url(#bg)"/>
  <rect x="2" y="2" width="956" height="246" rx="20" fill="none" stroke="#ddb877" stroke-opacity=".5" stroke-width="2"/>

  <!-- arrows -->
  <g fill="none" stroke="#ddb877" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 150 l14 0 m-6 -8 l8 8 l-8 8"/>
    <path d="M310 150 l14 0 m-6 -8 l8 8 l-8 8"/>
    <path d="M470 150 l14 0 m-6 -8 l8 8 l-8 8"/>
    <path d="M630 150 l14 0 m-6 -8 l8 8 l-8 8"/>
    <path d="M790 150 l14 0 m-6 -8 l8 8 l-8 8"/>
  </g>

  <!-- 1 torii -->
  <g transform="translate(80 150)">
    <rect x="-44" y="-52" width="88" height="10" rx="3" fill="#4d84a3" opacity=".0"/>
    <path d="M-58 -62 Q0 -76 58 -62 L54 -50 Q0 -60 -54 -50 Z" fill="#5c4f45"/>
    <rect x="-42" y="-44" width="84" height="9" rx="2" fill="#d16a5c"/>
    <rect x="-34" y="-50" width="12" height="96" rx="3" fill="#e8887a"/>
    <rect x="22" y="-50" width="12" height="96" rx="3" fill="#e8887a"/>
    <rect x="-42" y="46" width="28" height="8" rx="3" fill="#93867a"/>
    <rect x="14" y="46" width="28" height="8" rx="3" fill="#93867a"/>
  </g>
  <g transform="translate(80 38)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">1</text></g>

  <!-- 2 sando -->
  <g transform="translate(240 150)">
    <path d="M-26 -50 L26 -50 L62 56 L-62 56 Z" fill="#ecd2a0"/>
    <path d="M-8 -50 L8 -50 L16 56 L-16 56 Z" fill="#f7ecdd" opacity=".8"/>
    <!-- lanterns -->
    <g fill="#93867a">
      <rect x="-70" y="-6" width="16" height="6" rx="2"/><rect x="-66" y="0" width="8" height="38" rx="2"/><rect x="-74" y="-22" width="24" height="16" rx="3" fill="#5c4f45"/>
      <rect x="54" y="-6" width="16" height="6" rx="2"/><rect x="58" y="0" width="8" height="38" rx="2"/><rect x="50" y="-22" width="24" height="16" rx="3" fill="#5c4f45"/>
    </g>
    <circle cx="-44" cy="-44" r="14" fill="#9fc99a"/><circle cx="44" cy="-44" r="14" fill="#9fc99a"/>
  </g>
  <g transform="translate(240 38)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">2</text></g>

  <!-- 3 temizuya -->
  <g transform="translate(400 150)">
    <path d="M-56 -10 L56 -10 L44 40 L-44 40 Z" fill="#a9d2e6"/>
    <rect x="-60" y="-18" width="120" height="12" rx="5" fill="#7fb0c9"/>
    <rect x="-50" y="40" width="100" height="10" rx="4" fill="#93867a"/>
    <path d="M-30 -6 Q0 6 30 -6" fill="none" stroke="#fff" stroke-width="3" opacity=".8"/>
    <!-- ladle -->
    <g transform="rotate(-28)">
      <rect x="-6" y="-70" width="6" height="64" rx="3" fill="#a77b4f" transform="translate(30 -10)"/>
      <ellipse cx="33" cy="-12" rx="14" ry="8" fill="#c89b6a" transform="translate(0 0)"/>
    </g>
    <!-- drops -->
    <g fill="#7fb0c9"><path d="M-30 -48 q5 8 0 12 q-5 -4 0 -12z"/><path d="M-12 -60 q5 8 0 12 q-5 -4 0 -12z"/><path d="M6 -48 q5 8 0 12 q-5 -4 0 -12z"/></g>
  </g>
  <g transform="translate(400 38)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">3</text></g>

  <!-- 4 haiden + offering box -->
  <g transform="translate(560 150)">
    <path d="M-68 -34 Q0 -70 68 -34 L58 -22 Q0 -48 -58 -22 Z" fill="#5c4f45"/>
    <rect x="-52" y="-22" width="104" height="34" fill="#fbe9e5"/>
    <rect x="-52" y="12" width="104" height="8" fill="#d16a5c"/>
    <rect x="-40" y="-22" width="8" height="34" fill="#d16a5c"/><rect x="32" y="-22" width="8" height="34" fill="#d16a5c"/>
    <!-- offering box -->
    <rect x="-28" y="26" width="56" height="26" rx="3" fill="#a77b4f"/>
    <g stroke="#7a5732" stroke-width="3"><path d="M-18 28 v22 M-6 28 v22 M6 28 v22 M18 28 v22"/></g>
    <rect x="-28" y="22" width="56" height="7" rx="3" fill="#c89b6a"/>
    <circle cx="0" cy="-4" r="8" fill="#ddb877"/>
    <path d="M-3 -4 h6" stroke="#fff" stroke-width="2"/>
  </g>
  <g transform="translate(560 38)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">4</text></g>

  <!-- 5 pray (person + hands together) -->
  <g transform="translate(720 150)">
    <use href="#person" transform="translate(0 6)"/>
    <path d="M-8 -4 L0 -12 L8 -4 L0 6 Z" fill="#fbe9e5" stroke="#e8887a" stroke-width="2"/>
    <g stroke="#ddb877" stroke-width="4" stroke-linecap="round" fill="none"><path d="M-30 -20 l-12 -8"/><path d="M30 -20 l12 -8"/><path d="M-34 -4 l-14 0"/><path d="M34 -4 l14 0"/></g>
  </g>
  <g transform="translate(720 38)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">5</text></g>

  <!-- 6 leave: small torii + bow -->
  <g transform="translate(880 150)">
    <g transform="translate(-14 6) scale(.78)">
      <path d="M-58 -62 Q0 -76 58 -62 L54 -50 Q0 -60 -54 -50 Z" fill="#5c4f45"/>
      <rect x="-42" y="-44" width="84" height="9" rx="2" fill="#d16a5c"/>
      <rect x="-34" y="-50" width="12" height="96" rx="3" fill="#e8887a"/>
      <rect x="22" y="-50" width="12" height="96" rx="3" fill="#e8887a"/>
    </g>
    <path d="M28 -30 q22 4 20 36 m-9 -9 l9 10 l9 -11" fill="none" stroke="#ddb877" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(880 38)"><use href="#num"/><text text-anchor="middle" y="6" font-size="18" font-weight="700" fill="#fff" font-family="sans-serif">6</text></g>
</svg>
